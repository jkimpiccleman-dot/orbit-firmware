name: Build Orbit firmware

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get this repository
        uses: actions/checkout@v4

      - name: Get Waveshare's libraries for the board
        run: git clone --depth 1 https://github.com/waveshareteam/ESP32-S3-Touch-AMOLED-1.75.git ../waveshare

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install the ESP32 core (version Waveshare validated)
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.10

      - name: Compile
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:FlashSize=16M,PartitionScheme=app3M_fat9M_16MB,PSRAM=opi,FlashMode=qio,CDCOnBoot=cdc" \
            --libraries ../waveshare/examples/arduino/libraries \
            --output-dir build \
            orbit

      - name: Collect the .bin files and flash offsets
        run: |
          mkdir -p out
          cp build/orbit.ino.bootloader.bin out/bootloader.bin
          cp build/orbit.ino.partitions.bin out/partitions.bin
          cp build/orbit.ino.bin out/orbit-firmware.bin
          cp "$(find ~/.arduino15 -name boot_app0.bin | head -n 1)" out/boot_app0.bin
          if [ -f build/orbit.ino.merged.bin ]; then
            cp build/orbit.ino.merged.bin out/orbit-merged.bin
          else
            pip install esptool
            python -m esptool --chip esp32s3 merge_bin -o out/orbit-merged.bin \
              0x0 out/bootloader.bin 0x8000 out/partitions.bin 0xe000 out/boot_app0.bin 0x10000 out/orbit-firmware.bin
          fi
          CSV=$(find ~/.arduino15 -name app3M_fat9M_16MB.csv | head -n 1)
          APP0=""
          if [ -n "$CSV" ]; then APP0=$(grep -i app0 "$CSV" | head -n 1 | awk -F, '{gsub(/ /,"",$4); print $4}'); fi
          {
            echo "EASIEST: flash ONE file, orbit-merged.bin, at offset 0x0"
            echo ""
            echo "OR flash these four files:"
            echo "  bootloader.bin     0x0"
            echo "  partitions.bin     0x8000"
            echo "  boot_app0.bin      0xE000"
            echo "  orbit-firmware.bin ${APP0:-0x10000}"
          } > out/FLASH_OFFSETS.txt
          cat out/FLASH_OFFSETS.txt
          echo "--- partition table ---"
          if [ -n "$CSV" ]; then cat "$CSV"; fi
          ls -l out

      - name: Upload the .bin files
        uses: actions/upload-artifact@v4
        with:
          name: orbit-firmware
          path: out/
